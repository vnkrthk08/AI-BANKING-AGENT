[project]
name = "kural-ava"
version = "0.1.0"
description = "Deterministic text-first KURAL banking service prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.12.5,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-dotenv>=1.0,<2",
  "google-genai>=1.55,<3",
  "sarvamai>=0.1.33,<0.2",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "kural*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

