# Local production-like stack: PostgreSQL + migrations + API + workers + web.
# Copy .env.example to .env and set real secrets first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [kural-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment: &dburl
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: .
    env_file: .env
    environment:
      <<: *dburl
      KURAL_RUN_WORKERS: "false"
      KURAL_AUTO_MIGRATE: "false"
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      retries: 10

  worker:
    build: .
    env_file: .env
    environment:
      <<: *dburl
      KURAL_AUTO_MIGRATE: "false"
    command: ["python", "-m", "kural.workers"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  kural-postgres:
