name: KURAL AVA CI & Golden Evals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_twists:
        description: 'Run twists suite'
        required: false
        default: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis pyyaml fastapi pydantic uvicorn httpx

      - name: Run Unit Tests
        run: |
          pytest tests/ -q

      - name: Run Golden Call Evals
        run: |
          python -m evals.run --suite golden --gate

      - name: Run Secret Leakage Scan
        run: |
          python -m evals.leak_scan --from-run latest
