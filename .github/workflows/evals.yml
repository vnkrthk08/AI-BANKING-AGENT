name: KURAL AVA CI

on:
  push:
    branches: [ main, "phase4-*", "claude/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests (SQLite) + security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev,postgres]"
      - run: pytest tests/ -v
      - run: bandit -r kural app -ll -q
      - run: python -m evals.run --suite golden --gate

  postgres:
    name: Migrations + acceptance on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: kural, POSTGRES_PASSWORD: kural, POSTGRES_DB: kural }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGURL: postgresql+psycopg://kural:kural@localhost:5432/kural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev,postgres]"
      - name: Bidirectional migrations
        run: |
          DATABASE_URL=$PGURL alembic upgrade head
          DATABASE_URL=$PGURL alembic downgrade base
          DATABASE_URL=$PGURL alembic upgrade head
      - name: Acceptance on PostgreSQL
        run: KURAL_TEST_POSTGRES_URL=$PGURL pytest tests/test_platform_acceptance.py -v

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
