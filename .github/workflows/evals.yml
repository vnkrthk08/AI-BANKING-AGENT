name: KURAL AVA CI & Golden Evals

on:
  push:
    branches: [ main, "phase4-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_twists:
        description: 'Run twists suite'
        required: false
        default: 'true'

jobs:
  backend-test:
    name: Backend Tests & Golden Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v

      - name: Run Golden Call Evals
        run: |
          python -m evals.run --suite golden --gate

      - name: Run Secret Leakage Scan
        run: |
          python -m evals.leak_scan --from-run latest

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

